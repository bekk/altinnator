apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- base/deployment.yaml
- base/leader-election-role.yaml
- base/leader-election-rolebinding.yaml
- base/pdb.yaml
- base/service.yaml
- base/serviceaccount.yaml
- base/webhook-certificate.yaml
- base/webhook-issuer.yaml
- ../webhook

images:
- name: controller
  newName: altinnator
  newTag: latest

configMapGenerator:
- envs:
  - base/.env
  name: altinnator-env
  namespace: altinnator-system
