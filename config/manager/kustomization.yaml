apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- base/deployment.yaml
- base/leader-election-role.yaml
- base/leader-election-rolebinding.yaml
- base/pdb.yaml
- base/serviceaccount.yaml

images:
- name: controller
  newName: altinnator
  newTag: latest

configMapGenerator:
- envs:
  - base/.env
  literals:
  - ALTINNATOR_LOCAL_MOCK_URL=http://host.docker.internal:8090
  name: altinnator-env
  namespace: altinnator-system

secretGenerator:
- envs:
  - base/maskinporten.env
  name: altinnator-maskinporten
  namespace: altinnator-system
