apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  labels:
    app: altinnator
  name: webhook-cert
  namespace: altinnator-system
spec:
  dnsNames:
    - webhook-service.altinnator-system.svc
    - webhook-service.altinnator-system.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: webhook-selfsigned
  secretName: webhook-server-cert
