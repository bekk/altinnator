apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: altinnator
  name: altinnator
  namespace: altinnator-system
spec:
  replicas: 2
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: altinnator
  template:
    metadata:
      labels:
        app: altinnator
    spec:
      automountServiceAccountToken: true
      containers:
        - args:
            - -d
            - -leader-elect
            - -metrics-bind-address=0.0.0.0:8181
            - -metrics-secure=false
          env:
            - name: GOMEMLIMIT
              value: "230MiB"
          envFrom:
            - configMapRef:
                name: altinnator-env
            - secretRef:
                name: altinnator-maskinporten
          image: altinnator:latest
          imagePullPolicy: Never
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 30
          name: altinnator
          ports:
            - containerPort: 8181
              name: metrics
            - containerPort: 8081
              name: probes
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            initialDelaySeconds: 30
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_BIND_SERVICE
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
      imagePullSecrets:
        - name: github-auth
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: altinnator