name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-pr:
    name: Run go tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8

      - name: Running Tests
        run: |
          mise run test