apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: duplicate-resource-id
spec:
  steps:
    - try:
        - create:
            file: first.yaml
        - create:
            file: second.yaml
            expect:
              - check:
                  (contains($error, 'resourceId kv-chainsaw-duplicate-resource-id is already used')): true
